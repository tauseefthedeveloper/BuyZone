{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Secure Payment | BuyZone</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static '/images/logo.png' %}" rel="icon">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #1d2671, #c33764);
        }

        .payment-card {
            background: #fff;
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
            color: #3399cc;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .loader {
            width: 55px;
            height: 55px;
            border: 5px solid #eee;
            border-top: 5px solid #3399cc;
            border-radius: 50%;
            margin: 20px auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .warning {
            background: #fff4e5;
            color: #b45309;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 15px;
        }

        .cancel-button {
            margin-top: 22px;
            padding: 12px;
            width: 100%;
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .cancel-button:hover {
            background: #dc2626;
        }

        .secure-text {
            margin-top: 15px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="payment-card">
        <div class="logo">BuyZone</div>
        <div class="subtitle">Secure Razorpay Checkout</div>

        <div class="loader"></div>

        <h3>Redirecting you to payment gateway</h3>

        <div class="warning">
            ⚠ Please do not refresh or close this page while the payment is processing.
        </div>

        <button id="cancel-button" class="cancel-button">
            Cancel Payment
        </button>

        <div class="secure-text">
            🔒 100% Secure Payment via Razorpay
        </div>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
        var options = {
            "key": "{{ key_id }}",
            "currency": "INR",
            "name": "BuyZone",
            "logo": "http://127.0.0.1:8000/static/images/logo.png",
            "description": "Order Payment",
            "order_id": "{{ order_id }}",
            "method": {
                upi: true,
                card: true,
                netbanking: true,
                wallet: true
            },
            "handler": function (response) {
                 fetch("/handlerequest/", {
                     method: "POST",
                     headers: {
                         "Content-Type": "application/json",
                     },
                     body: JSON.stringify(response)
                 }).then(res => res.json())
                     .then(data => {
                         if (data.status === "success") {
                             window.location.href =
                                 "/paymentstatus/?status=success&razorpay_order_id=" +
                                 response.razorpay_order_id +
                                 "&razorpay_payment_id=" +
                                 response.razorpay_payment_id;
                         } else {
                             alert("Payment verification failed");
                         }
                     });
            },

            "modal": {
                "ondismiss": function () {
                    window.location.href =
                        "/paymentstatus/?status=canceled&razorpay_order_id={{ order_id }}";
                }
            },

            "prefill": {
            },

            "theme": {
                "color": "#3399cc"
            }
        };
        var rzp1 = new Razorpay(options);

        function openRazorpay() {
            rzp1.open();
        }

        openRazorpay();

        document.getElementById("cancel-button").addEventListener("click", function () {
            window.location.href =
                "/paymentstatus/?status=canceled&razorpay_order_id={{ order_id }}";
        });
    </script>

</body>

</html>
