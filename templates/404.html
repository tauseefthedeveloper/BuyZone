{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuyZone | 404 - Page Not Found</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .error-container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .error-image {
      width: 250px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    h1 {
      font-size: 100px;
      font-weight: 700;
      color: #0d6efd;
      letter-spacing: 5px;
    }

    h2 {
      font-weight: 600;
      color: #212529;
      margin-bottom: 10px;
    }

    p {
      color: #6c757d;
      font-size: 16px;
    }

    .btn-home {
      border-radius: 30px;
      padding: 10px 25px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .btn-home:hover {
      transform: translateY(-3px);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <img src="{% static 'images/404.jpg' %}" alt="404 Error" class="error-image">
    <h1>404</h1>
    <h2>Oops! Page Not Found</h2>
    <p>The page you are looking for doesn’t exist or has been moved.</p>
    <a href="/" class="btn btn-primary btn-home mt-3">
      <i class="bi bi-house-door"></i> Go to Home
    </a>
    <div class="mt-3 text-muted small">
      © 2025 Copyright {{ now|date:"Y" }} <strong>BuyZone</strong>. All rights reserved.
    </div>
  </div>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</body>
</html>
