{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BuyZone Delivery Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Favicon -->
  <link rel="icon" href="{% static 'images/logo.png' %}" />

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #eef2f7;
      overflow-x: hidden;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #212529;
      color: #fff;
      padding: 20px;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 1050;
      transform: translateX(0);
      transition: transform 0.3s ease;
    }

    .sidebar a {
      color: #fff;
      text-decoration: none;
    }

    .brand {
      font-weight: 600;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .brand img {
      height: 36px;
      margin-right: 10px;
    }

    .nav-link-custom {
      display: block;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .nav-link-custom:hover,
    .nav-link-custom.active {
      background: rgba(255, 255, 255, 0.15);
    }

    .logout {
      margin-top: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Main */
    .main {
      margin-left: 260px;
      padding: 24px;
      flex: 1;
    }

    .topbar {
      background: #fff;
      border-radius: 16px;
      padding: 14px 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .table-card {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      overflow-x: auto;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1040;
      display: none;
    }

    .overlay.show {
      display: block;
    }

    /* Mobile */
    @media (max-width: 992px) {
      .sidebar {
        transform: translateX(-100%);
        width: 100%;
      }

      .sidebar.show {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
        padding: 16px;
      }
    }

    @media (max-width: 480px) {
      .brand {
        font-size: 18px;
      }

      .brand img {
        height: 30px;
      }

      .nav-link-custom {
        padding: 14px;
        font-size: 15px;
      }

      .sidebar button {
        border-radius: 12px;
      }
    }
    #page-loader {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    #page-loader.show {
      display: flex;
    }
  </style>
</head>

<body>
  <div class="overlay" id="overlay"></div>

  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <button class="btn btn-outline-light w-100 mb-3 d-lg-none" id="closeSidebar">
        ✕ Close Menu
      </button>

      <div class="brand">
        <img src="{% static 'images/logo.png' %}" alt="BuyZone" />
        BuyZone
      </div>

      <nav>
        <a href="/delivery/dashboard/" class="nav-link-custom">Dashboard</a>
        <a href="/delivery/return/" class="nav-link-custom">Orders for Return</a>
        <a href="/delivery/stats/" class="nav-link-custom">Summary</a>
      </nav>

      <a href="{% url 'auth:handlelogout' %}" class="nav-link-custom logout">Logout</a>
    </aside>

    <!-- Main -->
    <main class="main">
      <!-- Mobile Topbar -->
      <div class="topbar d-lg-none">
        <div class="brand">
          <img src="{% static 'images/logo.png' %}" alt="BuyZone" />
          BuyZone
        </div>
        <button class="btn btn-dark w-100" id="toggleSidebar">☰ Open Menu</button>
      </div>

      <!-- Messages -->
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
        {{ message }}
        <button class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}

      <!-- Page Content -->
      <div class="table-card">{% block main %}{% endblock %}</div>
    </main>
  </div>

  <script>
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const toggleBtn = document.getElementById("toggleSidebar");
    const closeBtn = document.getElementById("closeSidebar");

    function openSidebar() {
      sidebar.classList.add("show");
      overlay.classList.add("show");
      toggleBtn.innerText = "✕ Close Menu";
    }

    function closeSidebar() {
      sidebar.classList.remove("show");
      overlay.classList.remove("show");
      toggleBtn.innerText = "☰ Open Menu";
    }

    toggleBtn?.addEventListener("click", () => {
      sidebar.classList.contains("show") ? closeSidebar() : openSidebar();
    });

    closeBtn?.addEventListener("click", closeSidebar);
    overlay.addEventListener("click", closeSidebar);

    // Active link
    document.querySelectorAll(".nav-link-custom").forEach(link => {
      if (link.getAttribute("href") === window.location.pathname) {
        link.classList.add("active");
      }
    });
  </script>
  <div id="page-loader">
    <div class="spinner-border text-primary" role="status"></div>
  </div>
<script>
  document.addEventListener("DOMContentLoaded", function () {

  const loader = document.getElementById("page-loader");
  if (!loader) return;

  function showLoader() {
    loader.classList.add("show");
  }

  function hideLoader() {
    loader.classList.remove("show");
  }

  /* Always hide loader on load / back */
  window.addEventListener("load", hideLoader);
  window.addEventListener("pageshow", hideLoader);

  /* Show loader on link click */
  document.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", function (e) {

      const href = link.getAttribute("href");

      /* Ignore invalid / fake links */
      if (!href || href === "#" || href.startsWith("javascript:")) return;

      /* Ignore sidebar toggle buttons */
      if (link.closest("#sidebar") && link.hasAttribute("id")) return;

      /* Ignore new tab */
      if (link.target === "_blank") return;

      showLoader();
    });
  });

  /* Show loader on form submit (future-proof) */
  document.querySelectorAll("form").forEach(form => {
    form.addEventListener("submit", () => {
      showLoader();
    });
  });

});
</script>

</body>
</html>
