{% extends "delivery/base.html" %}

{% block title %}Verify Delivery OTP{% endblock %}

{% block main %}

<div class="d-flex justify-content-center align-items-center" style="min-height: 75vh;">

  <div class="card shadow-lg p-4 otp-card">

    <div class="text-center mb-3">
      <h4 class="fw-bold text-primary mb-1">Verify Delivery OTP</h4>
      <p class="text-muted small">
        Enter the 6-digit OTP sent to the customer
      </p>
    </div>

    <form method="POST" id="otpForm">
      {% csrf_token %}

      <label class="form-label fw-semibold mt-2">6-Digit OTP</label>

      <input
        type="text"
        name="otp"
        maxlength="6"
        inputmode="numeric"
        pattern="[0-9]{6}"
        autocomplete="one-time-code"
        class="form-control otp-input"
        placeholder="••••••"
        required
      />

      <!-- SUBMIT -->
      <button
        id="verify-btn"
        type="submit"
        class="btn btn-success w-100 mt-4 py-2 rounded-pill">
        Verify & Complete Delivery
      </button>

      <!-- LOADER -->
      <button
        id="loading-btn"
        class="btn btn-success w-100 mt-4 py-2 rounded-pill d-none"
        type="button"
        disabled>
        <span class="spinner-border spinner-border-sm me-2"></span>
        Verifying OTP...
      </button>

    </form>

    <div class="text-center mt-3">
      <a href="javascript:history.back()" class="small text-secondary">
        ⬅ Back
      </a>
    </div>

  </div>

</div>

<style>
/* CARD */
.otp-card {
  max-width: 420px;
  width: 100%;
  border-radius: 18px;
}

/* OTP INPUT */
.otp-input {
  text-align: center;
  font-size: 1.8rem;
  font-weight: 700;
  letter-spacing: 10px;
  padding: 14px;
  border-radius: 12px;
}

.otp-input:focus {
  border-color: #198754;
  box-shadow: 0 0 0 0.2rem rgba(25,135,84,.25);
}

/* MOBILE */
@media (max-width: 576px) {
  .otp-input {
    font-size: 1.6rem;
    letter-spacing: 8px;
  }
}
</style>

<script>
const form = document.getElementById("otpForm");
const submitBtn = document.getElementById("verify-btn");
const loaderBtn = document.getElementById("loading-btn");

form.addEventListener("submit", function () {
  submitBtn.classList.add("d-none");
  loaderBtn.classList.remove("d-none");
});
</script>

{% endblock %}
