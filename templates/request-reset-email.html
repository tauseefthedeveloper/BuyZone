{% extends 'base.html' %} 
{% block title %}Reset password{% endblock title %} 
{% block content %}

<div class="card bg-light p-5">

  {% for message in messages %}

  <div class="alert alert-{{message.tags}} alert-dismissible fade show" role="alert">
    <strong>{{message}}</strong>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endfor %}  
  
  <h3 class="text-dark">Request a password reset Link</h3>

  <form action="/auth/request-reset-email/" method="post">
    {% csrf_token %}
    <br />

    <label for="email">Email</label>
    <div class="form-group">
      <input
        type="email"
        class="form-control p-2"
        id="email"
        name="email"
        required
      />
    </div>
   <br>
    <button id="submit-btn" type="submit" class="btn btn-dark mb-2">Submit</button>
    <button style="display:none;" class="btn btn-dark" type="button" disabled>
      <span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
      Submitting...
    </button>
    <br />
   <a href="/">Go Back</a>
    <br />
  </form>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
      let submitBtn = document.getElementById("submit-btn");
      submitBtn.addEventListener("click", function () {
        submitBtn.style.display = "none";
        submitBtn.nextElementSibling.style.display = "inline-block";
      });
    });
  </script>
{% endblock content %}
